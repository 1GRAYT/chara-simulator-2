<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chara Simulator II — Активация</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      background: linear-gradient(135deg, #240046 0%, #5a189a 50%, #ff6d00 100%);
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: rgba(15, 10, 25, 0.88);
      border: 2px solid rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 109, 0, 0.2);
      color: #ff9e44;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.2;
      margin-bottom: 14px;
    }

    .notice {
      font-size: 18px;
      font-weight: bold;
      line-height: 1.45;
      color: #ffd166;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .sub {
      font-size: 14px;
      line-height: 1.5;
      color: #d6cde6;
    }

    .studio {
      margin-top: 22px;
      font-size: 12px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.55);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">IG RA • Limited Edition</div>
    <h1>Chara Simulator II</h1>
    <div class="notice">Активация будет доступна в январе 2027</div>
    <p class="sub">
      Сохрани свою карточку с кодом до запуска активации. Позже здесь появится загрузка полной версии игры.
    </p>
    <div class="studio">IG RA</div>
  </main>
</body>
</html>
